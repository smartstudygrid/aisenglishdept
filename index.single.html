<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCric - Squads & Live Scoring</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700;800&family=Rajdhani:wght@600;700&family=Roboto+Condensed:wght@400;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style id="css-base">
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;color:#fff;font-family:'Rajdhani',sans-serif;background:linear-gradient(180deg,#020818,#040d2a 40%,#061535 70%,#03100d) fixed;padding:0 16px;display:flex;flex-direction:column}
.hm-wrap{max-width:720px;margin:0 auto;text-align:center;padding:26px 0 40px}
.hm-s{font:600 13px Oswald;letter-spacing:6px;color:#7ab3ff;text-transform:uppercase}
.hm-n{font-family:Oswald;font-weight:700;font-size:42px;text-transform:uppercase;background:linear-gradient(135deg,#c8a84b,#f5d073,#ffeea0,#f5d073,#c8a84b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hm-t{font-size:13px;letter-spacing:3px;color:rgba(200,200,220,.65)}
.hm-line{width:300px;max-width:80%;height:1px;background:linear-gradient(90deg,transparent,#c8a84b,transparent);margin:10px auto 0}
.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media(max-width:640px){.hm-grid{grid-template-columns:1fr}}
.hm-card{text-align:left;border:1px solid rgba(200,168,75,.35);border-radius:14px;padding:20px;background:rgba(255,255,255,.04)}
.hm-card h2{font:700 20px Oswald;letter-spacing:2px;color:#f5d073;margin:0 0 6px;text-transform:uppercase}
.hm-card p{margin:0 0 12px;color:rgba(200,210,255,.75);font-size:14px}
.hm-btn{display:block;width:100%;margin-top:10px;cursor:pointer;border:none;border-radius:8px;padding:11px;font:700 14px Oswald;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#c8a84b,#f5d073);color:#0a0a1a}
.hm-btn.sec{background:transparent;color:#7ab3ff;border:1px solid rgba(100,160,255,.4)}
.hm-login{max-width:460px;margin:20px auto;text-align:left;border:1px solid rgba(200,168,75,.3);border-radius:12px;padding:20px;background:rgba(255,255,255,.04)}
.hm-login label{display:block;font-size:12px;letter-spacing:2px;color:rgba(200,210,255,.7);margin:10px 0 4px;text-transform:uppercase;font-weight:700}
.hm-login input{width:100%;background:rgba(0,20,60,.6);border:1px solid rgba(100,150,255,.25);color:#fff;border-radius:6px;padding:9px 10px;font:600 15px Rajdhani}
.hm-msg{margin-top:10px;text-align:center;font-weight:700;min-height:20px}.hm-err{color:#ff7b7b}.hm-ok{color:#6be58c}
.hm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hm-user{font-size:13px;letter-spacing:1px;color:#9aa6d6}
.hm-link{background:none;border:none;color:#7ab3ff;cursor:pointer;font:700 13px Oswald;letter-spacing:1px;text-decoration:underline;padding:0}
.hm-foot{position:fixed;bottom:8px;left:14px;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(2,8,24,.7);padding:2px 6px;border-radius:4px;z-index:40}
.hm-foot a{color:#fff}
.ush{font:700 16px Oswald,sans-serif;letter-spacing:2px;color:#f5d073;text-transform:uppercase;margin-bottom:8px;text-align:center}
body.light .ush{color:#8a6d1f}
.th{justify-content:center;text-align:center}
.tn,.ts{text-align:center}
.top.top-c{position:relative;justify-content:center}
.top.top-c h1{flex:none;margin:0}
.bkbtn{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(195,164,105,.15);color:#f5d073;border:1.5px solid rgba(200,168,75,.55);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
body.light .bkbtn{background:rgba(184,145,42,.12);color:#8a6d1f;border-color:rgba(184,145,42,.6)}
#tabbar{position:sticky;bottom:0;z-index:60;display:flex;margin:0 -16px;background:rgba(10,13,26,.97);border-top:1px solid rgba(200,168,75,.25);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
#tabbar[hidden]{display:none}
.tabbtn{flex:1;background:transparent;border:none;color:#9aa6d6;font:600 11px Outfit,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.tabbtn .ti{font-size:20px}
.tabbtn .ti svg,.hm-hic svg{width:22px;height:22px;display:block}
.tabbtn.on{color:#f5d073}
#netbar{text-align:center;font:700 12px Oswald;letter-spacing:2px;background:#7a1f1f;color:#fff;padding:6px 8px}
#netbar[hidden]{display:none}
#home-app,#squad-app,#scorer-app{flex:1 0 auto}
body.tabs-on #home-app{padding-bottom:70px}
#admin-side{position:fixed;left:0;top:0;bottom:0;width:232px;z-index:60;background:#0d1127;border-right:1px solid rgba(200,168,75,.25);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow-y:auto}
#admin-side[hidden]{display:none}
.abtn{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:#cdd5e1;font:600 14px Outfit,sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.abtn.on{background:linear-gradient(135deg,#d97706,#f59e0b);color:#1c1005}
.abtn .ai{font-size:18px}
.ah{padding:4px 8px 12px;border-bottom:1px solid rgba(200,168,75,.2);margin-bottom:8px}
.ah b{color:#f5d073;font:800 16px Oswald;letter-spacing:1px}
body.side-on #home-app,body.side-on #squad-app,body.side-on #scorer-app{padding-left:232px}
@media(max-width:900px){#admin-side{display:none}body.side-on #home-app,body.side-on #squad-app,body.side-on #scorer-app{padding-left:0}}
body.light #tabbar{background:rgba(255,255,255,.97)}
body.light .tabbtn{color:#3d4a5c}
body.light .tabbtn.on{color:#8a6d1f}
body.light #admin-side{background:#f4f1e8}
body.light .abtn{color:#334155}
/* app logo on landing */
.hm-logo{display:block;width:min(320px,86%);height:auto;margin:2px auto 12px;object-fit:contain;background:none;padding:0;border-radius:18px;border:1.5px solid rgba(200,168,75,.55);box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 4px rgba(200,168,75,.12)}
body.light .hm-logo{border-color:rgba(184,145,42,.6);box-shadow:0 12px 30px rgba(15,23,42,.18),0 0 0 4px rgba(184,145,42,.14)}
/* in-app dialogs (replaces native prompt/confirm everywhere) */
.app-modal-ov{position:fixed;inset:0;background:rgba(2,8,24,.72);z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px}
.app-modal{background:#0d1530;border:1px solid rgba(200,168,75,.5);border-radius:14px;padding:20px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.app-modal-t{font:700 17px Oswald;letter-spacing:2px;color:#f5d073;text-transform:uppercase;margin-bottom:10px;text-align:center}
.app-modal-l{display:block;font-size:11px;letter-spacing:2px;color:rgba(200,210,255,.7);margin:10px 0 4px;text-transform:uppercase;font-weight:700}
.app-modal input,.app-modal select{width:100%;background:rgba(0,20,60,.6);border:1px solid rgba(100,150,255,.25);color:#fff;border-radius:8px;padding:10px;font:600 15px Rajdhani}
.app-modal-msg{white-space:pre-line;font-size:14px;color:#dbe4ff;line-height:1.55;margin:4px 0 6px}
.app-modal-btns{display:flex;gap:10px;margin-top:16px}
.app-modal-btns .hm-btn{margin-top:0}
body.light .app-modal{background:#fff;border-color:#e2e8f0}
body.light .app-modal-t{color:#8a6d1f}
body.light .app-modal-l{color:#2f3b4d}
body.light .app-modal input,body.light .app-modal select{background:#fff;border-color:#cbd5e1;color:#0f172a}
body.light .app-modal-msg{color:#334155}
/* in-app chooser (appPick) + action/share sheet (appSheet) */
.app-pick-sub{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(200,210,255,.75);text-align:center;margin:-4px 0 8px}
.app-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow-y:auto;padding:2px}
.app-pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:10px;border:1px solid rgba(120,150,220,.35);background:rgba(10,24,52,.65);color:#e8eeff;font:700 14px Rajdhani;text-align:left;cursor:pointer}
.app-pick .pk-t{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-pick .pk-s{font:600 11px Rajdhani;letter-spacing:.5px;color:rgba(200,210,255,.65)}
.app-pick.on{border-color:#f5d073;background:rgba(60,44,10,.5);box-shadow:inset 0 0 0 1px #f5d073}
.app-pick:disabled{opacity:.38;cursor:not-allowed}
.app-pick:not(:disabled):active{transform:scale(.97)}
.app-sheet-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:60vh;overflow-y:auto}
.app-sheet-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid rgba(120,150,220,.25);background:rgba(10,24,52,.6);color:#e8eeff;font:700 14px Rajdhani;text-align:left;cursor:pointer}
.app-sheet-row .sh-i{width:24px;text-align:center;font-size:17px}
.app-sheet-row .sh-t{flex:1;display:flex;flex-direction:column;min-width:0}
.app-sheet-row .sh-t small{display:block;font:600 11px Rajdhani;letter-spacing:.4px;color:rgba(200,210,255,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-sheet-row .sh-c{color:rgba(200,210,255,.5);font-size:16px}
.app-sheet-row:not(:disabled):active{transform:scale(.98)}
.app-sheet-row:disabled{opacity:.45;cursor:not-allowed}
body.light .app-pick-sub{color:#2f3b4d}
body.light .app-pick{background:#f8fafc;border-color:#cbd5e1;color:#0f172a}
body.light .app-pick .pk-s{color:#334155}
body.light .app-pick.on{border-color:#b8912a;background:#fff7e0;box-shadow:inset 0 0 0 1px #b8912a}
body.light .app-sheet-row{background:#f8fafc;border-color:#cbd5e1;color:#0f172a}
body.light .app-sheet-row .sh-t small{color:#334155}
/* overlay: hide app footer entirely (credit tab sits on the ticker's right) */
body.ovb .hm-foot,body[data-view="overlay"] .hm-foot{display:none}
/* ---- polished UI additions (all views) ---- */
.hm-hero{position:relative;padding:6px 0 0;overflow:visible;background:none;border:none;box-shadow:none}
.hm-hero:before{display:none}
.hm-banner{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(200,168,75,.55);min-height:150px;display:flex;align-items:center;justify-content:center;padding:0;background:radial-gradient(120% 90% at 50% 0%,rgba(140,200,255,.28),transparent 55%),linear-gradient(180deg,#0a1a3a 0%,#0d2b4d 33%,#1d5c2e 33.5%,#2e7d40 62%,#1d5c2e 100%)}
.hm-banner:before{content:"";position:absolute;left:0;right:0;top:33.5%;bottom:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 44px,transparent 44px 88px)}
.hm-banner:after{content:"";position:absolute;left:50%;top:40%;bottom:7%;width:min(120px,26%);transform:translateX(-50%);background:linear-gradient(180deg,#cda96f,#a9854f);border-radius:4px;opacity:.92}
.hm-banner-logo{position:relative;z-index:1;width:100%;height:auto;display:block;object-fit:cover;border-radius:16px;filter:drop-shadow(0 3px 0 rgba(122,95,26,.9)) drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.hm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:640px){.hm-stats{grid-template-columns:repeat(2,1fr)}}
.hm-stat{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:rgba(0,10,30,.55)}
.hm-stat b{display:block;font:800 24px Oswald;color:#f5d073;line-height:1}
.hm-stat span{font:600 11px Oswald;letter-spacing:2px;color:#9aa6d6;text-transform:uppercase}
.hm-card{transition:transform .15s ease,box-shadow .15s ease}
.hm-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.hm-btn{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.hm-btn:hover{filter:brightness(1.06);box-shadow:0 8px 22px rgba(245,208,115,.28)}
.hm-btn:active{transform:scale(.98)}
.hm-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:6px;animation:hmblink 1.3s infinite}
.hm-live-btn{display:flex;align-items:center;justify-content:center}
.hm-live-n{display:inline-block;min-width:22px;padding:1px 7px;margin-left:8px;border-radius:999px;background:rgba(0,0,0,.28);font:800 12px Oswald;letter-spacing:.5px;color:inherit}
body.light .hm-live-n{background:rgba(0,0,0,.12)}
@keyframes hmblink{50%{opacity:.35}}
.hm-search{width:100%;background:rgba(0,20,60,.6);border:1px solid rgba(100,150,255,.25);color:#fff;border-radius:8px;padding:10px;font:600 14px Rajdhani;margin-top:10px}
.hm-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0d1530;border:1px solid rgba(200,168,75,.5);color:#ffe9a8;padding:10px 16px;border-radius:10px;font:700 13px Oswald;letter-spacing:1px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.hm-skel{border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.12),rgba(255,255,255,.06));background-size:200% 100%;animation:hmsh 1.2s infinite;min-height:54px;margin:8px 0}
@keyframes hmsh{to{background-position:-200% 0}}
/* share-image extras */
.sx-link{margin-top:10px;text-align:center;font:700 13px Oswald;letter-spacing:1.5px;color:#0a0f26;background:#b8f23a;border-radius:10px;padding:8px;word-break:break-all}
.sx-qr-sub{text-align:center;font:600 11px Oswald;letter-spacing:2px;color:#9aa6d6;margin-top:6px}
.pt-wrap{border:2px solid #22d3ee;border-radius:18px;padding:16px;background:#0d1127}
.fx-hero{text-align:center;padding:18px;border:2px solid #7b3fff;border-radius:20px;background:#0d1127}
.fx-vs{font:800 22px Oswald;color:#7b3fff;letter-spacing:3px;margin:8px 0}
</style>
<style id="css-polish">
/* high-polish overrides for scorer + squad (loaded last so it wins) */
body[data-view="scorer"] .card{box-shadow:0 12px 28px rgba(0,0,0,.5);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
body[data-view="scorer"] .card:hover{transform:translateY(-2px);border-color:rgba(245,208,115,.65);box-shadow:0 16px 34px rgba(0,0,0,.55)}
body[data-view="scorer"] .btn{box-shadow:0 8px 20px rgba(0,0,0,.4)}
body[data-view="scorer"] .btn:active{transform:scale(.98)}
body[data-view="scorer"] .tabs .btn{border-radius:999px}
body[data-view="squad"] .card{transition:transform .14s ease}
body[data-view="squad"] .card:hover{transform:translateY(-2px)}
body[data-view="squad"] .btn:active{transform:scale(.98)}
/* points table */
.pt-card{border:1px solid rgba(200,168,75,.3);border-radius:12px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.pt-card table.pt{margin-top:0}
.pt-pos{display:inline-flex;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);align-items:center;justify-content:center;font:700 12px Oswald}
.pt-pts{display:inline-block;min-width:34px;padding:3px 10px;border-radius:999px;background:linear-gradient(135deg,#c8a84b,#f5d073);color:#0a0a1a;font:800 14px Oswald}
.pt-form{white-space:nowrap}
.pf{display:inline-flex;width:20px;height:20px;border-radius:50%;font:700 11px Oswald;font-style:normal;align-items:center;justify-content:center;margin-right:2px;vertical-align:middle}
.pf.w{background:#16a34a;color:#fff}.pf.l{background:#dc2626;color:#fff}.pf.t{background:#6b7280;color:#fff}.pf.a{background:#f59e0b;color:#0a0a1a}
tr.pt-top td{background:rgba(245,208,115,.10)}
.pt-legend{padding:9px 10px;font-size:12px;color:rgba(255,255,255,.55);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* tournament stats */
.st-sec{margin-bottom:14px}
.st-table{width:100%;border-collapse:collapse;font-size:14px}
.st-table td{padding:7px 4px;border-top:1px solid rgba(255,255,255,.08);text-align:right}
.st-table td:first-child{text-align:left}
.st-table b{color:var(--g)}
/* broadcast credit attached to TOP of the score ticker */
.ob-credit{position:absolute;bottom:100%;right:12px;background:rgba(0,0,0,.78);color:#ffd700;font:600 .72rem Oswald;letter-spacing:.14rem;padding:.18rem .7rem;border-radius:.45rem .45rem 0 0;border:.06rem solid rgba(255,215,0,.45);border-bottom:none;white-space:nowrap;text-transform:uppercase}
/* share-image guard: exports always stay dark */
#sumImg .mut{color:rgba(255,255,255,.55)!important}
#sumImg .pt-legend{color:rgba(255,255,255,.55)!important}
#sumImg .pt-pos{background:rgba(255,255,255,.12)!important;color:#fff!important}
/* icon buttons: equal-share one-row action bars */
.ib{flex:1 1 0!important;min-width:0;padding:8px 4px!important;font-size:16px!important;line-height:1!important;text-align:center;margin:0!important}
.ib-row{display:flex;gap:6px;align-items:stretch}
.act-row{display:flex;gap:10px;margin-bottom:10px}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fffdf6,#f8eed9);border:1.5px solid #c8a84b;border-radius:999px;padding:9px 4px;box-shadow:0 8px 18px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.18);cursor:pointer;text-decoration:none;color:#1a2333}
.act-btn{font:700 14px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase}
.act-btn:active{transform:scale(.96)}
body.light .act-btn{background:linear-gradient(180deg,#ffffff,#f6ead0);color:#1a2333;border-color:#b8912a;box-shadow:0 8px 18px rgba(15,23,42,.16),0 2px 4px rgba(15,23,42,.12)}
.act-btn:active{transform:scale(.96)}
body.light .act-btn{background:linear-gradient(180deg,#ffffff,#f6ead0);color:#1a2333;border-color:#b8912a}
</style>
<style id="css-light">
/* ============ LIGHT MODE (body.light) — share images (#sumImg) & broadcast overlay (.ob) stay dark ============ */
.hm-menu{position:fixed;left:14px;top:14px;z-index:9600;width:46px;height:46px;border-radius:999px;border:1px solid rgba(200,168,75,.55);background:linear-gradient(135deg,#c8a84b,#f5d073);color:#0a0a1a;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .12s ease}
.hm-menu:active{transform:scale(.93)}
.hm-back{position:fixed;right:14px;top:14px;z-index:9600;width:46px;height:46px;border-radius:999px;border:1px solid rgba(200,168,75,.55);background:linear-gradient(135deg,#c8a84b,#f5d073);color:#0a0a1a;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .12s ease}
.hm-back:active{transform:scale(.93)}
/* reserve space so the fixed menu never covers view headers/buttons */
#home-app,#squad-app,#scorer-app{padding-top:60px}
body.light .hm-menu,body.light .hm-back{background:linear-gradient(135deg,#b8912a,#f5d073);border-color:#b8912a}
body.ovb .hm-menu,body[data-view="overlay"] .hm-menu,body.ovb .hm-back,body[data-view="overlay"] .hm-back{display:none}
.hm-scrim{position:fixed;inset:0;z-index:9690;background:rgba(2,8,24,.6);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s}
.hm-scrim.open{opacity:1;visibility:visible}
body.ovb .hm-scrim,body[data-view="overlay"] .hm-scrim{display:none}
.hm-drawer{position:fixed;left:0;top:0;bottom:0;z-index:9700;width:min(320px,86vw);background:#0D1117;border-right:1px solid rgba(255,255,255,.08);box-shadow:24px 0 60px rgba(0,0,0,.55);transform:translateX(-106%);visibility:hidden;transition:transform .24s ease,visibility .24s;display:flex;flex-direction:column;font-family:'Outfit','Segoe UI',sans-serif}
.hm-drawer button{font-family:inherit}
.hm-drawer.open{transform:none;visibility:visible}
body.ovb .hm-drawer,body[data-view="overlay"] .hm-drawer{display:none}
#hm-drawer-body{overflow-y:auto;padding:16px 14px 20px;display:flex;flex-direction:column;gap:4px;min-height:0;flex:1}

// ---------- role shell: bottom tabs (users) / sidebar (admin) ----------
const HOME_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5h4v5"/></svg>';
const IC={home:HOME_SVG,cricket:String.fromCodePoint(0x1F465),score:String.fromCodePoint(0x1F3CF),account:String.fromCodePoint(0x1F464),tours:String.fromCodePoint(0x1F3C6),scorers:String.fromCodePoint(0x1F465),squads:String.fromCodePoint(0x270F),teams:String.fromCodePoint(0x1F6E1),users:String.fromCodePoint(0x1F464),matches:String.fromCodePoint(0x1F4CB),fixtures:"🗓️"};
function routeHome(){if(Auth.admin){setView("squad");sqAdmin();}else setView("home");}

function cricketView(){
  setCssForHome();
  const em=myEmail(),seg=ScS.cseg||"teams";
  const myT=SqTeams.filter(t=>canEditSquad(t.id)).sort((a,b)=>a.name.localeCompare(b.name));

  const g={l:[],u:[],p:[]};myM.forEach(m=>g[mcCat(m)].push(m));
  g.l.sort((a,b)=>(b.when||0)-(a.when||0));g.u.sort((a,b)=>(a.when||0)-(b.when||0));g.p.sort((a,b)=>(b.when||0)-(a.when||0));

function resolveTeam(q){
  q=String(q||"").trim();if(!q)return{err:"Enter a team code or name."};

function sqCrop(file,ratio,circle,w=192,q=.62){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onerror=()=>{URL.revokeObjectURL(url);rej();};
    im.onload=()=>{
      const W=w,H=Math.round(W/ratio);
      const ov=document.createElement("div");ov.className="modal";
      ov.innerHTML=`<div class="mb"><div class="mt">Frame face + shoulders</div><canvas width="${W}" height="${H}" class="cv ${circle?"rc":""}"></canvas><input type="range" id="z" min="1" max="6" step="0.01" value="1"><div class="hint">Drag to move · slider or scroll to zoom</div><div style="display:flex;gap:10px"><button class="btn sec auto" id="cx">Cancel</button><button class="btn auto" id="ck">Use photo</button></div></div>`;
      sqRoot().append(ov);
      const c=ov.querySelector("canvas"),g=c.getContext("2d"),zs=ov.querySelector("#z");
      const base=Math.max(W/im.width,H/im.height);
      let z=1,x=0,y=0,drag=null;
      const draw=()=>{const s=base*z,mx=(im.width*s-W)/2,my=(im.height*s-H)/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));g.fillStyle="#000";g.fillRect(0,0,W,H);g.drawImage(im,W/2+x-im.width*s/2,H/2+y-im.height*s/2,im.width*s,im.height*s);};
      const done=v=>{URL.revokeObjectURL(url);ov.remove();res(v);};
      zs.oninput=()=>{z=+zs.value;draw();};
      c.onwheel=e=>{e.preventDefault();z=Math.min(6,Math.max(1,z-e.deltaY*.003));zs.value=z;draw();};
      c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};
      c.onpointermove=e=>{if(!drag)return;const k=W/c.getBoundingClientRect().width;x+=(e.clientX-drag[0])*k;y+=(e.clientY-drag[1])*k;drag=[e.clientX,e.clientY];draw();};
      c.onpointerup=()=>drag=null;
      ov.querySelector("#cx").onclick=()=>done(null);
      ov.querySelector("#ck").onclick=()=>done(c.toDataURL("image/jpeg",q).split(",")[1]);
      draw();
    };
    im.src=url;
  });
}

async function usersAdmin(from,forceTid){
  const host=(from==="squad"||from==="mine")?sqRoot():$("#scorer-app");
  if(from!=="squad"&&from!=="mine"){CurView="scorer";document.body.dataset.view="scorer";$("#home-app").hidden=true;$("#squad-app").hidden=true;$("#scorer-app").hidden=false;const sc=$("#css-scorer");if(sc)sc.disabled=false;const sq=$("#css-squad");if(sq)sq.disabled=true;}
  if(from==="mine"){
    if(!forceTid||!canManageTour(forceTid)){toast("Not allowed.");return myTours();}
    CurView="squad";document.body.dataset.view="squad";$("#home-app").hidden=true;$("#squad-app").hidden=false;$("#scorer-app").hidden=true;
    const sq2=$("#css-squad");if(sq2)sq2.disabled=false;const sc2=$("#css-scorer");if(sc2)sc2.disabled=true;document.body.classList.remove("sq");
  }
  host.innerHTML=`<div class="${from==="scorer"?"w":"wrap"}"><div class="msg">Loading scorers…</div></div>`;
  let users=[];
  const isMine=from==="mine";
  if(!isMine){
    try{users=(await getDocs(collection(db,"scorers"))).docs.map(d=>({id:d.id,...d.data()}));}catch(e){host.innerHTML=`<div class="${from==="scorer"?"w":"wrap"}"><div class="msg">Couldn't load scorers — sign in as admin, or ask for access (Firestore rules may block this).</div></div>`;setBack(()=>setView("home"));return;}
  }
  await loadTours();
  let selT=forceTid||ScS.tour||Tours[0]?.id||"default";
  if(!Tours.some(t=>t.id===selT))selT=Tours[0]?.id||"default";
  let fq="";
  const inTour=u=>(u.tids||[]).includes(selT);
  const render=(fmsg="",isOk=false)=>{
    const SQ=from!=="scorer";
    {const a=$("#css-squad"),b=$("#css-scorer");if(SQ){if(a)a.disabled=false;if(b)b.disabled=true;}else{if(a)a.disabled=true;if(b)b.disabled=false;}}
    const srcList=isMine?tourScorers(selT).map(em=>({id:em})):users.filter(inTour);
    const list=srcList.filter(u=>!fq||u.id.includes(fq));
    host.innerHTML=`<div class="${from==="scorer"?"w":"wrap"}">
    <div class="th"><div><div class="tn gold">Scorers</div></div></div>
    <div class="ts" style="margin-bottom:8px">Score-only access - scorers can score matches, nothing else.</div>
    ${forceTid?`<div class="lock">🏆 ${esc(tname(selT))} (your tournament)</div>`:`<label class="l">Tournament</label><select id="us-t">${Tours.map(t=>`<option value="${esc(t.id)}" ${t.id===selT?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`}
    ${SQ?`<div class="panel" style="margin-top:10px"><div class="ush">Add scorer</div>`:`<div class="xm" style="margin-top:10px"><h3>Add scorer</h3>`}
      <label class="l">Email</label><input id="ue" type="text" autocomplete="off" placeholder="scorer@email.com">
      <label class="l">Temp password <span class="mut">(min 6 — blank if they already have an account)</span></label><input id="up" type="password" autocomplete="new-password" placeholder="Set once, they can reset later">
      <button class="btn" id="ua">Add Scorer</button>
      <div class="hint">They sign in on Home → can only open &amp; score ${esc(tname(selT))} matches. No scheduling, no delete, no tournaments/teams.</div>
    </div>
    <label class="l" style="margin-top:10px">Scorers in ${esc(tname(selT))} (${srcList.length})</label>
    <input id="uq" type="text" placeholder="🔍 Filter by email…" value="${esc(fq)}">
    ${list.map(u=>`<div class="row"><b>${esc(u.id)}</b><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm auto" data-rs="${esc(u.id)}">Send reset email</button><button class="btn sm sec auto" data-rm="${esc(u.id)}">Remove</button></div></div>`).join("")||`<div class="mut c" style="margin:14px 0">No scorers in this tournament yet.</div>`}
    <div id="msg" class="msg" style="color:${isOk?"#6be58c":""}">${esc(fmsg)}</div></div>`;
    if($("#us-t"))$("#us-t").onchange=e=>{selT=e.target.value;render();};
    $("#uq").oninput=e=>{fq=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const q=$("#uq");if(q){q.focus();q.setSelectionRange(pos,pos);}};
    setBack(()=>{if(from==="mine")myTours();else if(from==="squad")sqAdmin();else if(from==="home")setView("home");else scList();});
    $("#ua").onclick=async()=>{
      const em=$("#ue").value.trim().toLowerCase(),pw=$("#up").value;
      const flash=(t,ok)=>{const m=$("#msg");m.textContent=t;m.style.color=ok?"#6be58c":"";};
      if(!em.includes("@"))return flash("Enter a valid email.");
      if(pw&&pw.length<6)return flash("Password must be at least 6 characters.");
      $("#ua").disabled=true;
      try{
        if(pw){
          try{const a2=getAuth(getApps().find(a=>a.name==="sec")||initializeApp(cfg,"sec"));await createUserWithEmailAndPassword(a2,em,pw);await signOut(a2);}
          catch(e){if(e.code!=="auth/email-already-in-use")throw e;}
        }
        // ADD-ONLY: admin writes the scorer doc; owners write the tournament array
        if(isMine){
          await setDoc(doc(db,"tournaments",selT),{scorerEmails:arrayUnion(em)},{merge:true});
          await loadTours();
          render(`Scorer ${em} added to ${tname(selT)}.`,true);
        }else{
          await setDoc(doc(db,"scorers",em),{email:em,tids:arrayUnion(selT)},{merge:true});
          users=(await getDocs(collection(db,"scorers"))).docs.map(d=>({id:d.id,...d.data()}));
          render(pw?`Scorer ${em} added to ${tname(selT)}.`:`${em} added to ${tname(selT)} (existing account kept).`,true);
        }

    host.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.rm;

      // REMOVE-ONLY from this tournament; keep everything else intact
      if(isMine){
        updateDoc(doc(db,"tournaments",selT),{scorerEmails:arrayRemove(id)}).then(async()=>{
          await loadTours();
          render("Removed.",true);
        }).catch(e=>{const m=$("#msg");m.textContent=e.message;});
      }else{
        updateDoc(doc(db,"scorers",id),{tids:arrayRemove(selT)}).then(async()=>{
          users=(await getDocs(collection(db,"scorers"))).docs.map(d=>({id:d.id,...d.data()}));
          render("Removed.",true);
        }).catch(e=>{const m=$("#msg");m.textContent=e.message;});
      }
    });
    host.querySelectorAll("[data-rs]").forEach(b=>b.onclick=async()=>{try{await sendPasswordResetEmail(auth,b.dataset.rs);const m=$("#msg");m.textContent="Reset email sent.";m.style.color="#6be58c";}catch(e){const m=$("#msg");m.textContent=e.message;}});
  };
  render();
}

// Camera QR scanner (resolves scanned text, or null). Needs HTTPS/localhost for camera.
function camErr(e){
  const n=(e&&e.name)||"";
  if(n==="NotAllowedError"||n==="SecurityError")return "Camera blocked - allow camera access in the browser site settings, then retry. Or type the code.";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "No camera found on this device - type the code instead.";
  if(n==="NotReadableError")return "Camera is busy in another app - close it and retry, or type the code.";
  if(n==="TypeError")return "Camera needs a secure page (open the hosted HTTPS link) - type the code instead.";
  return "Camera unavailable ("+((e&&e.message)||"unknown error")+") - type the code instead.";
}
function scanQRCode(){
  return new Promise(res=>{
    if(window.isSecureContext===false){toast("Camera needs a secure page - open the hosted HTTPS link, or type the code.");return res(null);}
    if(!window.jsQR||!navigator.mediaDevices?.getUserMedia){
      toast("Camera scanning unavailable here — type the code instead.");return res(null);
    }
    const ov=document.createElement("div");ov.className="app-modal-ov";
    ov.innerHTML=`<div class="app-modal"><div class="app-modal-t">📷 Scan QR</div><video id="qr-v" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><div class="app-modal-msg" id="qr-m">Point the camera at the QR code…</div><div class="app-modal-btns"><button class="hm-btn sec" data-x="0">Cancel</button></div></div>`;
    document.body.appendChild(ov);
    const video=ov.querySelector("#qr-v"),msg=ov.querySelector("#qr-m");
    let stop=false,stream=null,raf=0;
    const done=v=>{stop=true;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();res(v);};
    ov.querySelector('[data-x="0"]').onclick=()=>done(null);
    ov.addEventListener("mousedown",e=>{if(e.target===ov)done(null);});
    const canvas=document.createElement("canvas"),g=canvas.getContext("2d",{willReadFrequently:true});
    const tick=()=>{
      if(stop)return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        g.drawImage(video,0,0);
        try{
          const code=window.jsQR(g.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height);
          if(code&&code.data){done(code.data.trim());return;}
        }catch{}
      }
      raf=requestAnimationFrame(tick);
    };
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s=>{stream=s;video.srcObject=s;video.play().catch(()=>{});tick();}).catch((e)=>{msg.textContent=camErr(e);});
  });
}
function parseInvite(txt){
  txt=(txt||"").trim();if(!txt)return null;
  let m=txt.match(/[?&]join=([^&#]+)/);
  if(m)return{kind:"tour",id:decodeURIComponent(m[1])};
  m=txt.match(/[?&]team=([^&#]+)/);
  if(m)return{kind:"team",id:decodeURIComponent(m[1])};
  if(Tours.some(t=>t.id===txt))return{kind:"tour",id:txt};
  if(SqTeams.some(t=>t.id===txt))return{kind:"team",id:txt};
  const byCode=SqTeams.find(t=>(t.code||"")===txt.toUpperCase());
  if(byCode)return{kind:"team",id:byCode.id};
  return null;
}

function teamBatInnings(m,T){
  const aide=T===m.t1?1:2,first=((m.bat1==null?1:m.bat1)===aide);
  const h1=m.hist1||[],h2=m.history||[];
  if(m.innings===2)return first?{bat:h1,bowl:h2}:{bat:h2,bowl:h1};
  return first?{bat:h2,bowl:[]}:{bat:[],bowl:h2};
}
function teamStatsHtml(teamId){
  const ms=ScMatches.filter(m=>(m.t1===teamId||m.t2===teamId)&&m.status==="completed");
  if(!ms.length)return`<div class="mut c" style="margin:24px 0">No completed matches yet - stats appear here after games finish.</div>`;
  let W=0,L=0,T=0,NR=0,rf=0,ra=0,hs=0;
  const P={},prow=n=>P[n]??={n,m:0,inns:0,r:0,b:0,f4:0,f6:0,hs:0,w:0,bo:0,br:0,ct:0,st:0,ro:0};let ballsSeen=0;
  ms.forEach(m=>{
    const aide=teamId===m.t1?1:2,anm=aide===1?m.n1:m.n2,first=(m.bat1===aide);
    if(m.endType==="walkover"){const w=m.walkoverWinner;if(w===anm)W++;else if(w)L++;else NR++;}
    else if(m.endType==="abandoned"||m.endType==="noresult")NR++;
    else if(m.runs>m.inn1){first?L++:W++;}
    else if(m.runs<m.inn1){first?W++:L++;}
    else T++;
    const fr=first?(m.inn1||0):(m.runs||0),ag=first?(m.runs||0):(m.inn1||0);
    rf+=fr;ra+=ag;if(fr>hs)hs=fr;
    const bb=teamBatInnings(m,teamId),ri={},seen=new Set();
    bb.bat.forEach(x=>{ballsSeen++;if(!x.s)return;seen.add(x.s);const p=prow(x.s);p.inns++;p.r+=x.br||0;if(x.e!=="wd")p.b++;if((x.br||0)===4)p.f4++;if((x.br||0)===6)p.f6++;ri[x.s]=(ri[x.s]||0)+(x.br||0);});
    Object.entries(ri).forEach(([n,v])=>{const p=prow(n);if(v>p.hs)p.hs=v;});
    bb.bowl.forEach(x=>{ballsSeen++;if(x.o){seen.add(x.o);const o=prow(x.o);o.bo+=x.b||0;o.br+=((x.e==="by"||x.e==="lb")?0:(x.r||0));if(x.w&&x.k!=="ro")o.w++;}if(x.f&&["c","st","ro"].includes(x.k)){seen.add(x.f);const f=prow(x.f);if(x.k==="c")f.ct++;else if(x.k==="st")f.st++;else f.ro++;}});
    seen.forEach(n=>prow(n).m++);
  });
  const all=Object.values(P).sort((a,b)=>b.r-a.r);
  const mvp=all.map(p=>({...p,score:p.r+20*p.w+10*(p.ct+p.st+p.ro)})).sort((a,b)=>b.score-a.score).slice(0,5);
  const pc=ms.length,wp=pc?Math.round(W/pc*100):0;
  const top=mvp.length?mvp[0].score:0;
  const medal=i=>["🥇","🥈","🥉"][i]||`#${i+1}`;
  return`<div class="ts-card ts-hero"><div class="ts-kicker">Team Record</div><div class="ts-rec"><div class="ts-big"><b>${pc}</b><span>Played</span></div><div class="ts-big ts-win"><b>${wp}%</b><span>Won</span></div><div class="ts-big"><b>${hs}</b><span>Best</span></div></div><div class="ts-strip"><span><b>${W}</b>Won</span><span><b>${L}</b>Lost</span><span><b>${T}</b>Tied</span><span><b>${NR}</b>NR</span><span><b>${rf}</b>For</span><span><b>${ra}</b>Against</span></div>${!ballsSeen?`<div class="mut">Ball-by-ball data missing - player stats need fully scored matches.</div>`:""}</div>`
  +`<div class="ts-card"><div class="ts-kicker">⭐ Team MVPs</div>${mvp.map((p,i)=>`<div class="ts-mvp"><span class="ts-medal">${medal(i)}</span><span class="ts-mvp-n">${esc(p.n)}<small>${p.r} runs · ${p.w} wkts</small></span><span class="ts-bar"><u style="width:${top?Math.round(p.score/top*100):0}%"></u></span><span class="ts-mvp-s">${p.score}<small>pts</small></span></div>`).join("")}</div>`
  +`<div class="ts-card"><div class="ts-kicker">Players (${all.length})</div><div style="overflow-x:auto"><table class="ts-table"><thead><tr><th>#</th><th>PLAYER</th><th>M</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>HS</th><th>W</th><th>OV</th><th>Rc</th><th>Ct</th></tr></thead><tbody>${all.map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:left"><b>${esc(p.n)}</b></td><td>${p.m}</td><td>${p.r}</td><td>${p.b}</td><td>${p.f4}</td><td>${p.f6}</td><td>${p.hs}</td><td>${p.w}</td><td>${Math.floor(p.bo/6)}.${p.bo%6}</td><td>${p.br}</td><td>${p.ct+p.st+p.ro}</td></tr>`).join("")}</tbody></table></div><div class="pt-legend">M matches - R runs - HS high score - W wickets - OV overs - Rc runs conceded - Ct catches+stumpings+runouts</div></div>`;
}

// Move a team into a tournament. Target must be owned/managed, reached via a shared
// join link (viaJoin), or be Friendly ("") to leave. Team owners can always leave.
async function moveTeamToTour(teamId,tid,viaJoin=false){
  await sqLoadTeams();await loadTours();
  const t=SqTeams.find(x=>x.id===teamId);
  if(!t)return toast("Team not found.");
  const tOwner=((t.owner||"")!==""&&(t.owner||"")===myEmail())||teamCoOwners(t.id).includes(myEmail());
  const targetOk=tid!==""&&Tours.some(x=>x.id===tid);
  const allowed=Auth.admin||(targetOk&&tourOwner(tid)===myEmail())||(tOwner&&(tid===""||(targetOk&&viaJoin)));
  if(needAccount())return;
  if(tid==="default"&&!Auth.admin)return toast("Challenger's Cup is locked — only the app admin can add teams.");
  if(!allowed)return toast("Not allowed.");
  if(t.tid===tid)return toast("Team is already there.");
  if(targetOk&&tid!==""&&tid!=="default"&&tourStatus(tid)==="archived"&&!Auth.admin&&tourOwner(tid)!==myEmail())return toast("Joining is closed for this tournament.");
  if(t.locked&&!tOwner&&!Auth.admin)return toast("That squad is locked — ask its owner to unlock first.");
  if(SqTeams.some(x=>x.id!==teamId&&x.tid===tid&&normName(x.name)===normName(t.name)))return toast("A team with that name already plays there.");
  try{
    const patch={tournament:tid};
    if(!Auth.admin)patch.editorEmails=arrayUnion(myEmail());
    await updateDoc(doc(db,"squads",teamId),patch);
    ScSquadsCache=null;await sqLoadTeams();
    toast(`"${t.name}" moved to ${tid===""?"Friendly":tname(tid)}.`);
  }catch(e){toast(e.message||"Couldn't move team.");}
}

async function claimTransfer(mid,tok){
  if(!auth.currentUser||auth.currentUser.isAnonymous){try{const cur=localStorage.getItem("scPendingTransfer");if(cur!==mid+"|"+tok){localStorage.setItem("scPendingTransfer",mid+"|"+tok);toast("Sign in to accept the scoring handover — you'll continue automatically.");}}catch{}setView("home");return;}
  let snap=null;try{snap=await getDoc(scRef(mid));}catch(e){snap=null;}
  if(!snap||!snap.exists()){setView("home");toast("Transfer link invalid.");return;}
  const m={...snap.data(),id:snap.id,history:snap.data().history||[]};
  if(m.status!=="live"||scInfo(m).done){setView("home");toast("That match is no longer live.");return;}
  if(!m.transferToken||m.transferToken!==tok||(m.transferExp||0)<Date.now()){setView("home");toast("Transfer link expired or already used.");return;}
  try{
    await updateDoc(scRef(mid),{scoredBy:myEmail(),scoredAt:Date.now(),grant:myEmail(),transferToken:"",transferExp:0,reqBy:"",reqAt:0});
    ScS.claimed=true;
    try{history.replaceState(null,"",location.pathname+"?match="+mid);}catch{}
    setView("scorer");scOpenMatch(mid);toast("Scoring handed over to you.");
  }catch(e){setView("home");toast(e.message||"Couldn't accept transfer.");}
}

// Scoring lock: one live scorer at a time. The scorer keeps the pad until they hand it over (Transfer scoring) or approve a take-over request.
const claimActive=m=>{const by=(m.scoredBy||"").toLowerCase();return !!by&&by!==myEmail();};
const claimMine=m=>((m.scoredBy||"").toLowerCase()===myEmail());
// Take-over requests: requester writes reqBy/reqAt; active scorer approves or denies; expires after 2 minutes.
const REQ_MS=120000;
const reqLive=m=>{const b=(m.reqBy||"").toLowerCase();return!!b&&(Date.now()-(m.reqAt||0))<REQ_MS;};
const reqMine=m=>reqLive(m)&&(m.reqBy||"").toLowerCase()===myEmail();
const reqWho=e=>{const em=String(e||"").toLowerCase();const t=SqTeams.find(x=>((x.owner||"").toLowerCase())===em||teamEditors(x.id).includes(em)||teamCoOwners(x.id).includes(em));return t?t.name:(em||"Someone");};
// While in a match view, re-check the lock and request state every 15s so an expired request clears itself.
function ensureLockTick(){
  if(ScS.lockT)return;
  ScS.lockT=setInterval(()=>{
    if(ScS.view!=="match"||!ScS.m){clearInterval(ScS.lockT);ScS.lockT=null;return;}
    const m=ScS.m;if(m.status!=="live")return;
    if(ScS.editInfo||ScS.endMenu||ScS.out||ScS.cb||ScS.ex)return;
    const lock=m.status==="live"&&!scInfo(m).done&&claimActive(m),rq=reqLive(m);
    if(lock!==ScS.lockSeen||rq!==ScS.reqLive){ScS.lockSeen=lock;ScS.reqLive=rq;manageClaim();scMatchView();}
  },15000);
}
// In-app Allow/Deny dialog for the active scorer when someone requests take-over.
function scReqDialog(mid,by){
  if(document.querySelector(".req-ov"))return;
  const ov=document.createElement("div");ov.className="app-modal-ov req-ov";
  ov.innerHTML=`<div class="app-modal"><div class="app-modal-t">✊ Take Over Request</div><div class="app-modal-msg">${esc(reqWho(by))} wants to take over scoring of this match. Allow?</div><div class="app-modal-btns"><button class="hm-btn sec" data-x="0">Deny</button><button class="hm-btn" data-x="1">✊ Allow</button></div></div>`;
  document.body.appendChild(ov);
  const done=v=>{ov.remove();if(v){ScS.claimed=false;}scAct(()=>updateDoc(scRef(mid),v?{scoredBy:by,scoredAt:Date.now(),grant:by,reqBy:"",reqAt:0}:{reqBy:"",reqAt:0}));};
  ov.querySelector('[data-x="0"]').onclick=()=>done(false);

}
// App-wide alerts: take-over requests aimed at the active scorer, and challenges aimed at me.
function scAlerts(){
  if(!Auth.user||isAnon())return;
  const em=myEmail();if(!em)return;
  const seen=ScS.reqSeen||(ScS.reqSeen={});
  ScMatches.forEach(m=>{
    if(m.status!=="live"||!claimMine(m)||!reqLive(m)||reqMine(m))return;
    if(seen[m.id]===(m.reqAt||0))return;
    seen[m.id]=m.reqAt||0;
    scReqDialog(m.id,(m.reqBy||"").toLowerCase());
  });
  ScMatches.forEach(m=>{
    if((m.challenged||"").toLowerCase()!==em||m.status!=="scheduled")return;
    let sm={};try{sm=JSON.parse(localStorage.getItem("scChalSeen")||"{}");}catch{}
    const k=em+"|"+m.id;if(sm[k])return;
    sm[k]=1;const ks=Object.keys(sm);if(ks.length>150)ks.slice(0,ks.length-150).forEach(x=>delete sm[x]);
    try{localStorage.setItem("scChalSeen",JSON.stringify(sm));}catch{}
    const mt2=[m.t1,m.t2].find(id=>SqTeams.some(t=>t.id===id&&canEditSquad(t.id)));
    toast("⚔️ "+(mt2?(mt2===m.t1?m.n2:m.n1):"A team")+" challenged you — see My Cricket → Matches.");
  });
}
function manageClaim(){
  const m=ScS.m;if(!m)return;
  if(m.status!=="live"||!canScore(m)||!Auth.user){ScS.claimed=claimMine(m);return;}
  if(claimMine(m)){ScS.claimed=true;return;}
  if(!claimActive(m)&&!ScS.claimed){ScS.claimed=true;scAct(async()=>{await updateDoc(scRef(m.id),{scoredBy:myEmail(),scoredAt:Date.now()});if((m.reqBy||"").toLowerCase()===myEmail())await updateDoc(scRef(m.id),{reqBy:"",reqAt:0}).catch(()=>{});});return;}
  ScS.claimed=false;
}

function fxCompute(tid,G){
  const sts=ScStagesCache[tid]||[];
  const st=stageOf(tid,G.sid);
  const nameOf=id=>(ScSquadsCache.find(x=>x.id===id)||{}).name||id;
  const pools=(st&&st.groups&&st.groups.length)?st.groups.map(g=>({gid:g.id,gname:g.name,ids:(g.teamIds||[]).filter(id=>ScSquadsCache.some(x=>x.id===id))})):[{gid:"",gname:"",ids:fxTeams(tid).map(t=>t.id)}];
  const warns=[],rows=[];
  const seen=new Set(ScMatches.filter(m=>m.tid===tid&&m.status==="scheduled").map(m=>fxPairKey(m.t1,m.t2)+"@"+(m.stageId||"")));
  const slots=(G.slots||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(!slots.length)return{rows:[],warns:["Add at least one time slot."],skipped:0};
  const per=Math.max(1,+G.per||1);
  let idx=0,skipped=0;
  for(const p of pools){
    if(p.ids.length<2){warns.push((p.gname||"Tournament")+" needs at least 2 teams - skipped.");continue;}
    let rounds=circlePairings(p.ids);
    const base=rounds.length;
    if(G.dbl)rounds=rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
    rounds.forEach((pairs,ri)=>{
      const rno=ri+1;
      const round=G.dbl?(ri<base?`R${rno}`:`R${rno} (2nd leg)`):`R${rno}`;
      pairs.forEach(([a,b])=>{
        if(seen.has(fxPairKey(a,b)+"@"+(G.sid||""))){skipped++;return;}
        const day=fxAddDays(G.date,Math.floor(idx/per));
        const t=slots[idx%slots.length];
        rows.push({a,b,na:nameOf(a),nb:nameOf(b),round,gid:p.gid,gname:p.gname,date:day,time:t,venue:G.venue,when:(day&&t)?(new Date(day+"T"+t).getTime()||0):0});
        idx++;
      });
    });
    if(p.ids.length%2)warns.push((p.gname||"Tournament")+" has an odd team count - one bye per round.");
  }
  const dc={};
  rows.forEach(r=>{if(!r.date)return;[r.a,r.b].forEach(t=>{const k=t+"@"+r.date;dc[k]=(dc[k]||0)+1;});});
  Object.keys(dc).forEach(k=>{if(dc[k]>1){const[t,d]=k.split("@");warns.push(nameOf(t)+" plays "+dc[k]+"x on "+d+".");}});
  const vc={};
  rows.forEach(r=>{if(!r.date||!r.time||!r.venue)return;const k=r.venue+" @ "+r.date+" "+r.time;vc[k]=(vc[k]||0)+1;});
  Object.keys(vc).forEach(k=>{if(vc[k]>1)warns.push("Venue clash: "+k+" booked "+vc[k]+"x.");});
  if(rows.length>FX_CAP){warns.push("Capped at "+FX_CAP+" fixtures ("+(rows.length-FX_CAP)+" dropped).");rows.length=FX_CAP;}
  return{rows,warns,skipped};
}

  const sv=scRoot().querySelector("#fxg-sv");if(sv)sv.onclick=()=>fxSaveGen(tid);
}
function fxPreviewHtml(tid,P){
  if(!P.rows.length&&!P.warns.length)return`<div class="mut">Nothing to generate.</div>`;
  return`${P.warns.map(w=>`<div class="fx-warn">⚠️ ${esc(w)}</div>`).join("")}`
  +`${P.skipped?`<div class="mut">Skipped ${P.skipped} already-scheduled pairing(s).</div>`:""}`
  +`${P.rows.length?`<div style="overflow-x:auto"><table class="fx-prev"><tr><th>#</th><th>Date</th><th>Time</th><th>Fixture</th><th>Round</th><th>Venue</th></tr>${P.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.date||"TBD")}</td><td>${esc(r.time||"-")}</td><td><b>${esc(r.na)}</b> vs <b>${esc(r.nb)}</b>${r.gname?`<br><span class="mut">${esc(r.gname)}</span>`:""}</td><td>${esc(r.round)}</td><td>${esc(r.venue||"-")}</td></tr>`).join("")}</table></div><button class="btn" id="fxg-sv" style="margin-top:10px">✅ Save ${P.rows.length} fixture(s)</button>`:""}`;
}
async function fxSaveGen(tid){
  const G=ScS.fxGen;
  if(!G||G.tid!==tid||!G.prev||!G.prev.rows.length)return toast("Preview first.");
  if(!canManageTour(tid))return toast("Not allowed.");
  toast("Saving fixtures…");
  const ids=[...new Set(G.prev.rows.flatMap(r=>[r.a,r.b]))];
  const pls={};
  await Promise.all(ids.map(async id=>{try{const d=(await getDoc(doc(db,"squads",id))).data()||{};pls[id]={pl:[...new Set([d.captain_name,...(d.player_list||[])].filter(Boolean))],cap:d.captain_name||""};}catch{pls[id]={pl:[],cap:""};}}));
  try{
    const b=writeBatch(db);
    G.prev.rows.forEach(r=>{
      b.set(doc(db,"matches",rid("")),{tid,t1:r.a,t2:r.b,n1:r.na,n2:r.nb,pl1:(pls[r.a]||{}).pl||[],pl2:(pls[r.b]||{}).pl||[],c1:(pls[r.a]||{}).cap||"",c2:(pls[r.b]||{}).cap||"",overs:G.ov||10,ball:G.ball||"Leather",when:r.when||0,venue:(r.venue||"").trim(),city:"",tossWon:"",tossDec:"",stageId:G.sid||"",groupId:r.gid||"",g1:r.gid||"",g2:r.gid||"",kind:"GROUP_MATCH",round:r.round,fixtureStatus:G.pub?"published":"draft",status:"scheduled",bat1:null,innings:1,runs:0,balls:0,history:[],inn1:0,inn1w:0,inn1b:0,created:Date.now(),owner:myEmail()});
    });
    await b.commit();
    toast(`Saved ${G.prev.rows.length} fixture(s)${G.prev.skipped?`, skipped ${G.prev.skipped} existing`:""}.`);
  }catch(e){return toast(e.message||"Couldn't save fixtures.");}
  ScS.fxGen.prev=null;
  fixturesView(tid);
}
function fxPosterHTML(tid,list,sub){
  const gr=fxGroupRounds(list);
  const rows=gr.keys.map(k=>`<div class="fx2-sec">${esc(k.toUpperCase())}</div>`+gr.g[k].map((m,i)=>`<div class="fx2-row${i%2?" alt":""}"><span class="fx2-dt">${esc(m.when?when(m.when):"TBD")}</span><span class="fx2-mt"><b>${esc(m.n1)}</b><em>VS</em><b>${esc(m.n2)}</b></span><span class="fx2-vn">${esc(([m.venue,m.city].filter(Boolean).join(", "))||(m.overs+" OVERS"))}</span></div>`).join("")).join("");
  return`<div class="fx2-top"><div class="fx2-tour">${esc(tname(tid))}</div><div class="fx2-sub">${esc(sub)}</div></div>${rows}<div class="fx2-ftr">SmartCric</div>`;
}
function fxScopeSub(tid,sid,gid,n){
  return[tourSeasonYear(tid),"FIXTURES",sid?stageName(tid,sid):"",gid?groupName(tid,sid,gid):"",n+" MATCH"+(n===1?"":"ES")].filter(Boolean).join(" · ");
}
async function fxCapture(W){
  if(!window.html2canvas){$("#sumImg").innerHTML="";$("#sumImg").classList.remove("ls");return null;}
  const boxH=Math.ceil($("#sumImg").firstChild.getBoundingClientRect().height);
  const canvas=await html2canvas($("#sumImg"),{backgroundColor:"#06170d",scale:2,useCORS:true,width:W,height:boxH});
  $("#sumImg").innerHTML="";$("#sumImg").classList.remove("ls");
  return canvas;
}
async function scDownloadFixturesImage(tid,o={}){
  const fmt=o.format||"ls",share=!!o.share;
  const list=fxPubs(tid).filter(m=>(!o.sid||(m.stageId||"")===o.sid)&&(!o.gid||(m.groupId||"")===o.gid));
  if(!list.length)return toast("No published fixtures for this scope.");
  toast("Building fixtures poster…");
  const inner=fxPosterHTML(tid,list,fxScopeSub(tid,o.sid,o.gid,list.length));
  if(fmt==="story")$("#sumImg").classList.remove("ls");else $("#sumImg").classList.add("ls");
  $("#sumImg").innerHTML=`<div class="${fmt==="story"?"sx fx2-story fx2-poster":"sx sx-ls fx2-poster"}">${inner}</div>`;
  const canvas=await fxCapture(fmt==="story"?540:1200);
  if(!canvas)return;
  const fn=`fixtures-${tid}${o.sid?"-"+o.sid:""}${o.gid?"-"+o.gid:""}-${fmt}.jpg`;
  if(share){const ok=await shareCanvas(canvas,fn,"Fixtures",`${tname(tid)} fixtures`);if(!ok){downloadCanvas(canvas,fn);appShare({title:"Share fixtures",sub:"Image saved to your downloads — attach it in the share sheet.",waText:`🏏 ${tname(tid)} fixtures`});}}
  else{downloadCanvas(canvas,fn);toast("Poster downloaded.");}
}
async function scDownloadMatchdayImage(tid,day,o={}){
  const list=fxPubs(tid).filter(m=>fxDayKey(m)===day);
  if(!list.length)return toast("No fixtures on this date.");
  toast("Building matchday card…");
  const inner=fxPosterHTML(tid,list,fxScopeSub(tid,"","",list.length)+" · "+fxDayLabel(day).toUpperCase());
  const fmt=o.format||"ls";
  if(fmt==="story")$("#sumImg").classList.remove("ls");else $("#sumImg").classList.add("ls");
  $("#sumImg").innerHTML=`<div class="${fmt==="story"?"sx fx2-story fx2-poster":"sx sx-ls fx2-poster"}">${inner}</div>`;
  const canvas=await fxCapture(fmt==="story"?540:1200);
  if(!canvas)return;
  const fn=`matchday-${tid}-${day}.jpg`;
  if(o.share){const ok=await shareCanvas(canvas,fn,"Matchday",`${tname(tid)} matchday ${fxDayLabel(day)}`);if(!ok){downloadCanvas(canvas,fn);appShare({title:"Share matchday card",sub:"Image saved to your downloads — attach it in the share sheet.",waText:`🏏 ${tname(tid)} matchday ${fxDayLabel(day)}`});}}
  else{downloadCanvas(canvas,fn);toast("Card downloaded.");}
}
