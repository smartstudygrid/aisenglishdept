<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIS Calendar Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    html, body {
      background-color: transparent !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Glassmorphism Card Style matching screenshot */
    .task-card-ui {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      transition: all 0.2s ease-in-out;
    }

    .task-card-ui:hover {
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    /* Completed Task Styling */
    .task-completed .task-title-text {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .task-completed {
      opacity: 0.65;
    }

    /* Background Modes for Testing / Previewing overlays */
    body.preview-light {
      background-color: #fefcf3 !important; /* Soft warm cream like screenshot */
    }
    body.preview-dark {
      background-color: #0f172a !important;
      color: #f8fafc;
    }
    body.preview-dark .task-card-ui {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(51, 65, 85, 0.8);
      color: #f1f5f9;
    }
    body.preview-dark .task-title-text {
      color: #f8fafc;
    }
    body.preview-dark .sub-text {
      color: #94a3b8;
    }

    /* Custom Checkbox */
    .custom-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .custom-checkbox.checked {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
</head>

    <div id="empty-state" class="hidden text-center py-12 px-4 bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200">
      <div class="w-12 h-12 mx-auto mb-3 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-xl">
        <i class="fa-solid fa-calendar-check"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-800">No tasks due within the selected timeframe</h3>
      <p id="empty-msg" class="text-xs text-slate-500 mt-1">Try selecting 14 or 30 Days to see upcoming tasks.</p>
      <button onclick="setRange(30)" class="mt-3 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg transition">Show 30 Days</button>
    </div>

  </div>

  <!-- Manual Input Fallback Modal -->
  <div id="manual-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-5 space-y-3">
      <h3 class="text-base font-bold text-slate-800">Paste Source Page Content</h3>
      <p class="text-xs text-slate-500">Paste HTML or raw text from the calendar web page below:</p>
      <textarea id="manual-textarea" class="w-full h-40 p-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Paste standard HTML or raw text containing 'due in xx days'..."></textarea>
      <div class="flex justify-end space-x-2">
        <button onclick="closeManualInput()" class="px-3 py-1.5 border text-slate-600 text-xs font-medium rounded-lg">Cancel</button>
        <button onclick="processManualInput()" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-medium rounded-lg shadow-sm">Parse Content</button>
      </div>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://smartstudygrid.github.io/aiscalendar26-27/";

    // Application State
    let allParsedTasks = [];
    let currentSelectedRange = 30; // Default: 30 days
    let completedTaskKeys = new Set();

    const ACCENT_COLORS = [
      '#d97706', // Gold / Amber
      '#1d4ed8', // Dark Blue
      '#0284c7', // Sky Blue
      '#7c3aed', // Purple
      '#059669', // Emerald
      '#dc2626', // Red
      '#0f766e'  // Teal
    ];

    function logDebug(msg) {
      console.log(`[AIS Task Tracker] ${msg}`);
    }

    /**
     * The real source page (smartstudygrid.github.io/aiscalendar26-27) renders its
     * "Teacher Responsibilities Hub" checklist as static markup:
     *
     *   <div class="task-item" data-cat="task">
     *     <strong>Baseline Test Submission &amp; Assessment</strong>
     *     <span class="badge badge-task">Submission</span>
     *     <span class="countdown" data-due="2026-08-30"></span>
     *     <p><strong>Due:</strong> Week 2 (Aug 30, 2026) · Grades 4–8, 9–12 UK &amp; US</p>
     *   </div>
     *
     * The visible "Due in Xd" countdown text is written into the DOM by that page's
     * own JavaScript at runtime — it never exists in the raw HTML we fetch. The
     * machine-readable date lives in the countdown span's data-due attribute
     * (YYYY-MM-DD), so we read that directly instead of hunting for rendered text.
     */
    function extractHubTasks(doc, now) {
      const items = doc.querySelectorAll('#taskList .task-item');
      const tasks = [];

      items.forEach((item, idx) => {
        const titleEl = item.querySelector('.body > strong, strong');
        const badgeEl = item.querySelector('.badge');
        const countdownEl = item.querySelector('.countdown[data-due]');
        const pEl = item.querySelector('p');

        if (!titleEl || !countdownEl) return;

        const dueISO = countdownEl.getAttribute('data-due');
        if (!dueISO) return;

        const dueDate = new Date(dueISO + 'T00:00:00');
        if (isNaN(dueDate.getTime())) return;

        const title = titleEl.textContent.trim();
        const tag = badgeEl ? badgeEl.textContent.trim() : 'Task';

        let weekLabel = '';
        let streamInfo = 'All Programs';
        if (pEl) {
          const pText = pEl.textContent.replace(/^\s*Due:\s*/i, '').trim();
          const parts = pText.split('·').map(s => s.trim()).filter(Boolean);
          if (parts.length) {
            weekLabel = parts[0];
            if (parts.length > 1) streamInfo = parts.slice(1).join(' · ');
          }
        }

        const diffDays = Math.round((dueDate - now) / 86400000);

        tasks.push({
          id: `hub_${dueISO}_${idx}`,
          title: title,
          tag: tag,
          daysLeft: diffDays,
          dueDateStr: weekLabel || dueDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          streamInfo: streamInfo,
          accentColor: ACCENT_COLORS[idx % ACCENT_COLORS.length]
        });
      });

      return tasks;
    }

    /**
     * Parses the raw HTML fetched from the calendar site into structured task
     * objects, using the Teacher Responsibilities Hub checklist as the source of
     * truth (it's the site's own canonical task list, with reliable ISO due dates).
     */
    function parseCalendarContent(rawHTML) {
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHTML, 'text/html');

      let tasks = extractHubTasks(doc, now);

      if (tasks.length === 0) {
        logDebug("No task-list items found in fetched markup. Using bundled snapshot of the real checklist instead.");
        tasks = getFallbackCalendarData();
      } else {
        logDebug(`Extracted ${tasks.length} task(s) from the live Teacher Responsibilities Hub.`);
      }

      // Deduplicate by title & due date, just in case
      const uniqueTasks = [];
      const seen = new Set();
      tasks.forEach(t => {
        const key = `${t.title.toLowerCase()}_${t.dueDateStr}`;
        if (!seen.has(key)) {
          seen.add(key);
          uniqueTasks.push(t);
        }
      });

      return uniqueTasks;
    }

    async function fetchData() {
      const statusEl = document.getElementById("status-alert");
      const statusMsg = document.getElementById("status-msg");
      const statusIcon = document.getElementById("status-icon");
      const fallbackBtn = document.getElementById("status-fallback-btn");
      const refreshIcon = document.getElementById("refresh-icon");

      refreshIcon.classList.add("fa-spin");
      statusEl.classList.remove("hidden", "bg-red-50", "border-red-200", "text-red-800", "bg-emerald-50", "border-emerald-200", "text-emerald-800", "bg-amber-50", "border-amber-200", "text-amber-800");
      statusEl.classList.add("bg-blue-50", "border-blue-200", "text-blue-800");
      statusIcon.className = "fa-solid fa-spinner fa-spin text-blue-600";
      statusMsg.textContent = "Fetching latest tasks from calendar...";
      fallbackBtn.classList.add("hidden");

      logDebug(`Initiating fetch sequence for ${TARGET_URL}`);

      const proxies = [
        TARGET_URL,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(TARGET_URL)}`,
        `https://corsproxy.io/?${encodeURIComponent(TARGET_URL)}`
      ];

      let rawText = null;
      let success = false;

      for (let i = 0; i < proxies.length; i++) {
        try {
          logDebug(`Trying proxy endpoint #${i + 1}...`);
          const res = await fetch(proxies[i]);
          if (res.ok) {
            rawText = await res.text();
            if (rawText && rawText.length > 30) {
              success = true;
              logDebug(`Fetch succeeded from endpoint #${i + 1} (${rawText.length} bytes).`);
              break;
            }
          }
        } catch (err) {
          logDebug(`Endpoint #${i + 1} error: ${err.message}`);
        }
      }

      refreshIcon.classList.remove("fa-spin");

      if (success && rawText) {
        statusEl.classList.add("hidden");
        allParsedTasks = parseCalendarContent(rawText);
      } else {
        logDebug("Network fetch restricted by browser CORS. Loading live fallback dataset.");
        statusEl.classList.remove("bg-blue-50", "border-blue-200", "text-blue-800");
        statusEl.classList.add("bg-amber-50", "border-amber-200", "text-amber-800");
        statusIcon.className = "fa-solid fa-triangle-exclamation text-amber-600";
        statusMsg.textContent = "Direct fetch restricted by CORS policy. Showing parsed calendar dataset.";
        fallbackBtn.classList.remove("hidden");

        allParsedTasks = getFallbackCalendarData();
      }

      applyFilters();
    }

    function applyFilters() {
      const searchVal = document.getElementById("search-input").value.toLowerCase();

      const filtered = allParsedTasks.filter(task => {
        const withinDays = task.daysLeft >= 0 && task.daysLeft <= currentSelectedRange;
        const matchesSearch = task.title.toLowerCase().includes(searchVal) ||
                              task.tag.toLowerCase().includes(searchVal) ||
                              task.streamInfo.toLowerCase().includes(searchVal) ||
                              task.dueDateStr.toLowerCase().includes(searchVal);
        return withinDays && matchesSearch;
      });

      // Sort by days left ascending (most urgent first)
      filtered.sort((a, b) => a.daysLeft - b.daysLeft);

      renderTasks(filtered);
    }

    function renderTasks(tasks) {
      const container = document.getElementById("task-container");
      const emptyState = document.getElementById("empty-state");

      container.innerHTML = "";

      if (tasks.length === 0) {
        emptyState.classList.remove("hidden");
        document.getElementById("empty-msg").textContent = `No tasks due within the next ${currentSelectedRange} days matching your search.`;
        return;
      }

      emptyState.classList.add("hidden");

      tasks.forEach(task => {
        const isChecked = completedTaskKeys.has(task.id);

        const card = document.createElement("div");
        card.className = `task-card-ui p-4 relative flex items-start space-x-3.5 ${isChecked ? 'task-completed' : ''}`;
        
        // Left thick accent border bar matching screenshot design
        card.style.borderLeft = `5px solid ${task.accentColor}`;

        card.innerHTML = `
          <!-- Checkbox -->
          <div class="pt-0.5">
            <div onclick="toggleTask('${task.id}')" class="custom-checkbox ${isChecked ? 'checked' : ''}">
              ${isChecked ? '<i class="fa-solid fa-check text-white text-[10px]"></i>' : ''}
            </div>
          </div>

          <!-- Main Task Details -->
          <div class="flex-1 min-w-0">
            <!-- Top Line: Title + Tag + Due Badge -->
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center space-x-2 flex-wrap">
                <h3 class="task-title-text font-bold text-sm text-slate-900 tracking-tight leading-snug">
                  ${escapeHtml(task.title)}
                </h3>
                <span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-200/80 rounded-md text-[10px] font-bold tracking-wide uppercase">
                  ${escapeHtml(task.tag)}
                </span>
              </div>

              <!-- Due in XXd Badge matching screenshot -->
              <span class="px-2.5 py-0.5 bg-blue-50/80 text-blue-700 text-xs font-semibold rounded-md flex items-center space-x-1 border border-blue-100">
                <span>Due in ${task.daysLeft}d</span>
              </span>
            </div>

            <!-- Subtitle Line: Due Date & Stream Info -->
            <div class="sub-text mt-1 text-xs text-slate-600 flex flex-wrap items-center space-x-1">
              <span class="font-bold text-slate-800">Due:</span>
              <span>${escapeHtml(task.dueDateStr)}</span>
              <span class="text-slate-400 mx-1">·</span>
              <span>${escapeHtml(task.streamInfo)}</span>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleTask(id) {
      if (completedTaskKeys.has(id)) {
        completedTaskKeys.delete(id);
      } else {
        completedTaskKeys.add(id);
      }
      applyFilters();
    }

    function setRange(days) {
      currentSelectedRange = days;
      document.querySelectorAll(".range-btn").forEach(btn => {
        if (parseInt(btn.dataset.days, 10) === days) {
          btn.className = "range-btn active px-3 py-1 rounded-lg font-semibold bg-indigo-600 text-white shadow";
        } else {
          btn.className = "range-btn px-3 py-1 rounded-lg font-medium text-slate-600 hover:text-slate-900";
        }
      });
      applyFilters();
    }

    function setBgMode(mode) {
      document.body.classList.remove('preview-light', 'preview-dark');
      document.querySelectorAll('#bg-btn-transparent, #bg-btn-light, #bg-btn-dark').forEach(b => {
        b.className = "px-2.5 py-1 rounded-lg font-medium transition text-slate-600 hover:text-slate-900";
      });

      if (mode === 'light') {
        document.body.classList.add('preview-light');
        document.getElementById('bg-btn-light').className = "px-2.5 py-1 rounded-lg font-medium transition bg-white shadow text-slate-800";
      } else if (mode === 'dark') {
        document.body.classList.add('preview-dark');
        document.getElementById('bg-btn-dark').className = "px-2.5 py-1 rounded-lg font-medium transition bg-slate-800 text-white shadow";
      } else {
        document.getElementById('bg-btn-transparent').className = "px-2.5 py-1 rounded-lg font-medium transition bg-white shadow text-slate-800";
      }
    }

    /**
     * Offline snapshot of the real Teacher Responsibilities Hub checklist from
     * https://smartstudygrid.github.io/aiscalendar26-27/ (Semester 1 & 2, AY 2026–2027).
     * Used only if the live fetch is blocked (e.g. no network / CORS). daysLeft is
     * (re)computed against "today" every time this runs, so it stays accurate.
     */
    function getFallbackCalendarData() {
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      function daysUntil(iso) {
        const target = new Date(iso + 'T00:00:00');
        return Math.round((target - now) / 86400000);
      }

      const raw = [
        { iso: "2026-08-30", title: "Baseline Test Submission & Assessment", tag: "Submission", week: "Week 2 (Aug 30, 2026)", stream: "Grades 4–8, 9–12 UK & US" },
        { iso: "2026-09-27", title: "Submission of Mid-Term Test & Material Covered", tag: "Submission", week: "Week 6 (Sep 27, 2026)", stream: "All Programs" },
        { iso: "2026-11-15", title: "Submission of Final Exams (Model A & Model B)", tag: "Subject Directors", week: "Week 13 (Nov 15, 2026) for UK Gr. 9–12", stream: "Week 15 (Nov 29, 2026) for Gr. 4–8 & US Gr. 9–12" },
        { iso: "2026-12-06", title: "PBL Submission (ISA/ISE, Computer, Social Studies)", tag: "Submission", week: "Week 16 (Dec 6, 2026)", stream: "Semester 1" },
        { iso: "2026-12-13", title: "Entry of All PBL Grades, Quizzes & Uploading Material Covered", tag: "Gradebook Entry", week: "Week 17 (Dec 13, 2026)", stream: "Semester 1" },
        { iso: "2027-02-21", title: "Semester 2 Mid-Term Material & Test Upload", tag: "Submission", week: "Week 6 (Feb 21, 2027)", stream: "US Program" },
        { iso: "2027-05-02", title: "Semester 2 Final Exam & PBL Submission", tag: "Subject Directors", week: "Week 16 (May 2, 2027)", stream: "Gr. 4–8 & US Gr. 9–12" }
      ];

      return raw.map((t, idx) => ({
        id: `hub_${t.iso}_${idx}`,
        title: t.title,
        tag: t.tag,
        daysLeft: daysUntil(t.iso),
        dueDateStr: t.week,
        streamInfo: t.stream,
        accentColor: ACCENT_COLORS[idx % ACCENT_COLORS.length]
      }));
    }

    function openManualInput() {
      document.getElementById("manual-modal").classList.remove("hidden");
    }

    function closeManualInput() {
      document.getElementById("manual-modal").classList.add("hidden");
    }

    function processManualInput() {
      const text = document.getElementById("manual-textarea").value;
      if (text.trim()) {
        allParsedTasks = parseCalendarContent(text);
        applyFilters();
        closeManualInput();
        document.getElementById("status-alert").classList.add("hidden");
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    window.onload = function() {
      fetchData();
    };
  </script>
</body>
</html>
